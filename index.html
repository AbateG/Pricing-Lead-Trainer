<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pricing Lead Trainer — Etapa 0: Cimientos</title>
<style>
  :root{
    --ink-900:#0F1B2D;
    --ink-800:#1C304C;
    --ink-700:#24395A;
    --ink-650:#2C4368;
    --line:#3D5578;
    --line-soft:#2C4160;
    --parchment:#EDE7DA;
    --muted:#93A0B4;
    --muted-2:#6E7E96;
    --brass:#B28E34;
    --brass-bright:#D6B45C;
    --brass-dim:#7D6224;
    --teal:#2FA0A6;
    --teal-dim:#1E6B70;
    --green:#4C9A6A;
    --green-bg:#173324;
    --red:#C1503F;
    --red-bg:#3a1f1a;
    --font-display:Georgia,'Iowan Old Style','Palatino Linotype','Book Antiqua',serif;
    --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --font-mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
    --radius:10px;
    --ease:cubic-bezier(.22,.61,.36,1);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.4);
    --shadow-md:0 1px 2px rgba(0,0,0,0.35), 0 10px 24px rgba(0,0,0,0.32);
    --shadow-lg:0 2px 4px rgba(0,0,0,0.35), 0 20px 44px rgba(0,0,0,0.4);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(47,160,166,0.08), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(178,142,52,0.07), transparent 55%),
      var(--ink-900);
    color:var(--parchment);
    font-family:var(--font-body);
    line-height:1.55;
    min-height:100vh;
  }
  @keyframes viewFade{
    from{opacity:0; transform:translateY(4px);}
    to{opacity:1; transform:translateY(0);}
  }
  #app.fade{animation:viewFade .22s var(--ease);}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--brass); color:var(--ink-900);}

  :focus-visible{
    outline:2px solid var(--teal);
    outline-offset:3px;
    border-radius:4px;
  }

  .wrap{max-width:900px; margin:0 auto; padding:28px 20px 80px;}

  /* ---------- Header / Manifest strip ---------- */
  .manifest-header{
    display:flex; align-items:baseline; justify-content:space-between;
    gap:16px; flex-wrap:wrap;
    padding-bottom:18px; margin-bottom:22px;
    border-bottom:1px solid var(--line);
  }
  .manifest-header .brandmark{
    font-family:var(--font-mono);
    font-size:11px; letter-spacing:0.16em;
    color:var(--brass);
    text-transform:uppercase;
  }
  .manifest-header h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:26px;
    margin:4px 0 0;
    color:var(--parchment);
    letter-spacing:0.01em;
  }
  .manifest-header .subtitle{
    color:var(--muted);
    font-size:13.5px;
    margin-top:2px;
  }
  .manifest-header .stage-tag{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--ink-900);
    background:var(--brass);
    padding:5px 10px;
    border-radius:4px;
    letter-spacing:0.06em;
    white-space:nowrap;
    align-self:flex-start;
  }

  /* ---------- Overall progress + stage tabs ---------- */
  .overall-line{
    font-family:var(--font-mono); font-size:11px; color:var(--muted-2);
    margin-bottom:14px; letter-spacing:0.03em;
  }
  .stage-tabs{display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap;}
  .stage-tab{
    background:var(--ink-800); border:1px solid var(--line); color:var(--muted);
    border-radius:8px; padding:9px 14px; font-size:12.5px; cursor:pointer;
    display:flex; flex-direction:column; align-items:flex-start; gap:2px;
    text-align:left;
    box-shadow:var(--shadow-sm);
    transition:transform .14s var(--ease), border-color .14s var(--ease), box-shadow .14s var(--ease);
  }
  .stage-tab:hover{transform:translateY(-1px); border-color:var(--teal-dim); box-shadow:var(--shadow-md);}
  .stage-tab .t{font-weight:700; color:var(--parchment); font-size:13px;}
  .stage-tab .p{font-family:var(--font-mono); font-size:10.5px; color:var(--muted-2);}
  .stage-tab.active{border-color:var(--teal); background:var(--ink-700);}
  .stage-tab.active .t{color:var(--teal);}
  .stage-tab.stage-done .t::after{content:" \2713"; color:var(--green);}

  /* ---------- Route line (signature nav) ---------- */
  .route-line{
    position:relative;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin:0 0 30px;
    padding:6px 2px 0;
    overflow-x:auto;
    gap:2px;
  }
  .route-line::before{
    content:"";
    position:absolute;
    top:18px; left:22px; right:22px;
    height:2px;
    background:repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 11px);
  }
  .route-node{
    position:relative;
    display:flex; flex-direction:column; align-items:center;
    gap:6px;
    min-width:64px;
    text-decoration:none;
    padding:0 2px;
    background:transparent;
    border:none;
    cursor:pointer;
  }
  .route-node .dot{
    width:36px; height:36px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-size:12px; font-weight:700;
    background:var(--ink-800);
    border:2px solid var(--line);
    color:var(--muted);
    position:relative; z-index:1;
    transition:border-color .15s var(--ease), color .15s var(--ease), background .15s var(--ease), transform .15s var(--ease), box-shadow .15s var(--ease);
  }
  .route-node:hover .dot{transform:translateY(-1px); border-color:var(--teal-dim);}
  .route-node.current .dot{border-color:var(--teal); color:var(--teal); box-shadow:0 0 0 4px rgba(47,160,166,0.14);}
  .route-node.mastered .dot{background:var(--brass); border-color:var(--brass); color:var(--ink-900); box-shadow:var(--shadow-sm), 0 0 0 3px rgba(178,142,52,0.16);}
  .route-node.progress .dot{border-color:var(--brass-dim); color:var(--brass-bright);}
  .route-node.completed .dot{background:var(--teal-dim); border-color:var(--teal); color:var(--parchment);}
  .route-node .label{
    font-size:10.5px; color:var(--muted-2); text-align:center; max-width:70px;
    line-height:1.2;
  }
  .route-node.current .label, .route-node.mastered .label{color:var(--parchment);}

  /* ---------- Stats row ---------- */
  .stats-row{
    display:grid; grid-template-columns:repeat(3,1fr); gap:12px;
    margin-bottom:26px;
  }
  .stat-card{
    background:var(--ink-800);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
    box-shadow:var(--shadow-sm);
  }
  .stat-card .num{font-family:var(--font-display); font-size:24px; color:var(--brass-bright);}
  .stat-card .lbl{font-size:11.5px; color:var(--muted); margin-top:2px;}

  .continue-bar{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    background:var(--ink-800);
    border:1px solid var(--line-soft);
    border-left:3px solid var(--teal);
    border-radius:var(--radius);
    padding:14px 18px;
    margin-bottom:26px;
    flex-wrap:wrap;
    box-shadow:var(--shadow-md);
  }
  .continue-bar .txt strong{display:block; font-family:var(--font-display); font-size:16px;}
  .continue-bar .txt span{font-size:12.5px; color:var(--muted);}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--teal); color:#06181a;
    border:none; border-radius:6px;
    padding:10px 18px;
    font-size:14px; font-weight:600;
    cursor:pointer;
    text-decoration:none;
    transition:filter .12s ease, transform .05s ease;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn:active{transform:translateY(1px);}
  .btn.brass{background:var(--brass); color:var(--ink-900);}
  .btn.ghost{
    background:transparent; color:var(--parchment);
    border:1px solid var(--line);
  }
  .btn.ghost:hover{border-color:var(--teal); color:var(--teal);}
  .btn.small{padding:7px 12px; font-size:12.5px;}
  .btn[disabled]{opacity:0.4; cursor:not-allowed;}

  /* ---------- Concept cards (manifest entries) ---------- */
  .concept-list{display:flex; flex-direction:column; gap:10px;}
  .concept-card{
    display:flex; align-items:center; gap:16px;
    background:var(--ink-800);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 18px;
    position:relative;
    box-shadow:var(--shadow-sm);
    transition:transform .16s var(--ease), box-shadow .16s var(--ease), border-color .16s var(--ease);
  }
  .concept-card:hover{
    transform:translateY(-2px);
    box-shadow:var(--shadow-md);
    border-color:var(--teal-dim);
  }
  .concept-card .code{
    font-family:var(--font-mono);
    font-size:13px; color:var(--brass);
    background:var(--ink-700);
    border:1px solid var(--line);
    border-radius:5px;
    padding:5px 9px;
    min-width:52px; text-align:center;
    flex-shrink:0;
  }
  .concept-card .body{flex:1; min-width:0;}
  .concept-card .body h3{margin:0 0 3px; font-family:var(--font-display); font-size:16.5px; font-weight:600;}
  .concept-card .body p{margin:0; font-size:12.8px; color:var(--muted);}
  .badge{
    font-size:10.5px; letter-spacing:0.04em; text-transform:uppercase;
    padding:4px 9px; border-radius:20px; font-weight:700; flex-shrink:0;
  }
  .badge.new{background:var(--ink-700); color:var(--muted-2); border:1px solid var(--line);}
  .badge.progress{background:rgba(178,142,52,0.15); color:var(--brass-bright); border:1px solid var(--brass-dim);}
  .badge.completed{background:rgba(47,160,166,0.15); color:#7fd4d8; border:1px solid var(--teal-dim);}
  .badge.mastered{background:var(--green-bg); color:#7fcf9e; border:1px solid var(--green);}

  /* ---------- Lesson view ---------- */
  .crumb{font-size:12.5px; color:var(--muted); margin-bottom:10px;}
  .crumb a{color:var(--teal); text-decoration:none;}
  .lesson-head .code{font-family:var(--font-mono); color:var(--brass); font-size:13px;}
  .lesson-head h2{font-family:var(--font-display); font-size:24px; margin:6px 0 20px; font-weight:600;}
  .lesson-content p{font-size:15px; color:#DCD6C8; margin:0 0 15px;}
  .lesson-content strong{color:var(--brass-bright); font-weight:700;}

  .callout{
    background:var(--ink-800);
    border:1px solid var(--line);
    border-left:3px solid var(--brass);
    border-radius:8px;
    padding:16px 18px;
    margin:22px 0;
  }
  .callout .tag{font-family:var(--font-mono); font-size:10.5px; letter-spacing:0.1em; color:var(--brass); text-transform:uppercase; margin-bottom:6px; display:block;}
  .callout p{margin:0; font-size:14px; color:#DCD6C8;}

  .term-grid{display:grid; gap:10px; margin:18px 0 6px;}
  .term-row{
    display:grid; grid-template-columns:170px 1fr; gap:12px;
    background:var(--ink-800); border:1px solid var(--line); border-radius:8px;
    padding:11px 14px; font-size:13.5px;
  }
  .term-row .t{font-family:var(--font-mono); color:var(--teal); font-weight:700; font-size:12.5px;}
  .term-row .d{color:var(--muted);}
  @media (max-width:560px){ .term-row{grid-template-columns:1fr;} }

  .lesson-actions{display:flex; gap:10px; margin-top:26px; flex-wrap:wrap;}

  /* ---------- Quiz ---------- */
  .quiz-progress{
    font-family:var(--font-mono); font-size:11.5px; color:var(--muted);
    margin-bottom:14px; letter-spacing:0.04em;
  }
  .quiz-progress .barbg{
    height:4px; background:var(--ink-700); border-radius:3px; margin-top:6px; overflow:hidden;
  }
  .quiz-progress .barfg{height:100%; background:var(--teal);}
  .q-card{
    background:var(--ink-800); border:1px solid var(--line); border-radius:var(--radius);
    padding:22px 22px 20px;
    box-shadow:var(--shadow-md);
  }
  .q-card .prompt{font-family:var(--font-display); font-size:17px; margin:0 0 18px; line-height:1.45;}
  .opt{
    display:block; width:100%; text-align:left;
    background:var(--ink-700); border:1px solid var(--line);
    color:var(--parchment); border-radius:8px;
    padding:12px 14px; margin-bottom:9px;
    font-size:14px; cursor:pointer;
    transition:border-color .14s var(--ease), background .14s var(--ease), transform .1s var(--ease);
  }
  .opt:hover:not([disabled]){border-color:var(--teal); background:var(--ink-650); transform:translateX(2px);}
  .opt.correct{background:var(--green-bg); border-color:var(--green); color:#c7f0d4;}
  .opt.incorrect{background:var(--red-bg); border-color:var(--red); color:#f2c9c1;}
  .opt[disabled]{cursor:default;}

  /* ---------- Verdadero/Falso: fila de dos botones, no lista vertical ---------- */
  #opts.opts-tf{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  #opts.opts-tf .opt{margin-bottom:0; text-align:center; font-weight:700; padding:16px 14px;}

  /* ---------- Emparejar ---------- */
  .match-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 14px;}
  .match-chip{
    display:block; width:100%; text-align:left;
    background:var(--ink-700); border:1px solid var(--line);
    color:var(--parchment); border-radius:8px;
    padding:11px 13px; margin-bottom:9px;
    font-size:13px; cursor:pointer;
    transition:border-color .14s var(--ease), background .14s var(--ease), transform .1s var(--ease);
  }
  .match-chip:hover:not([disabled]){border-color:var(--teal); background:var(--ink-650); transform:translateX(2px);}
  .match-chip.selected{border-color:var(--teal); background:var(--ink-650); box-shadow:0 0 0 2px rgba(47,160,166,0.25);}
  .match-chip.correct{background:var(--green-bg); border-color:var(--green); color:#c7f0d4;}
  .match-chip.incorrect{background:var(--red-bg); border-color:var(--red); color:#f2c9c1;}
  .match-chip[disabled]{cursor:default;}
  @media (max-width:560px){ .match-grid{grid-template-columns:1fr;} }

  /* ---------- Ordenar ---------- */
  .order-pool{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
  .order-chip{
    background:var(--ink-700); border:1px solid var(--line); color:var(--parchment);
    border-radius:20px; padding:9px 15px; font-size:13px; cursor:pointer;
    transition:border-color .14s var(--ease), background .14s var(--ease);
  }
  .order-chip:hover{border-color:var(--teal); background:var(--ink-650);}
  .order-seq{display:flex; flex-direction:column; gap:8px; min-height:44px;}
  .order-slot{
    display:flex; align-items:center; gap:10px;
    background:var(--ink-800); border:1px solid var(--line-soft); border-radius:8px;
    padding:10px 13px; font-size:13.5px;
  }
  .order-num{
    font-family:var(--font-mono); font-size:11px; font-weight:700;
    background:var(--brass); color:var(--ink-900);
    width:20px; height:20px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .order-empty{color:var(--muted-2); font-size:12.5px; font-style:italic;}
  .order-correct-ref{margin-top:10px; padding-top:10px; border-top:1px solid var(--line); font-size:12.5px; line-height:1.7;}
  .feedback{
    margin-top:14px; padding:13px 15px; border-radius:8px;
    font-size:13.5px; border:1px solid var(--line);
  }
  .feedback.ok{background:var(--green-bg); border-color:var(--green); color:#bfe8cd;}
  .feedback.bad{background:var(--red-bg); border-color:var(--red); color:#f0cec6;}
  .feedback .lbl{font-weight:700; display:block; margin-bottom:4px;}

  .summary-card{
    background:var(--ink-800); border:1px solid var(--line); border-radius:var(--radius);
    padding:26px; text-align:center;
    box-shadow:var(--shadow-lg);
  }
  .summary-card .score{font-family:var(--font-display); font-size:40px; color:var(--brass-bright);}
  .summary-card .score-lbl{color:var(--muted); font-size:13px; margin-top:2px;}

  .reflection{
    background:var(--ink-800); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px; margin-top:22px;
    box-shadow:var(--shadow-sm);
  }
  .reflection .tag{font-family:var(--font-mono); font-size:10.5px; letter-spacing:0.1em; color:var(--teal); text-transform:uppercase;}
  .reflection h4{font-family:var(--font-display); font-size:15.5px; margin:8px 0 12px; font-weight:600;}
  .reflection textarea{
    width:100%; min-height:90px; background:var(--ink-900); color:var(--parchment);
    border:1px solid var(--line); border-radius:6px; padding:11px; font-family:var(--font-body);
    font-size:13.5px; resize:vertical;
  }
  .reflection .model-answer{
    margin-top:12px; padding:13px 15px; background:var(--ink-900); border-left:3px solid var(--teal);
    border-radius:6px; font-size:13.5px; color:var(--muted); display:none;
  }
  .reflection .model-answer.show{display:block;}
  .reflection .row{display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; align-items:center;}
  .saved-note{font-size:12px; color:var(--green); opacity:0; transition:opacity .3s ease;}
  .saved-note.show{opacity:1;}

  .empty-state{
    background:var(--ink-800); border:1px dashed var(--line); border-radius:var(--radius);
    padding:32px; text-align:center; color:var(--muted);
  }

  footer.appfoot{
    margin-top:50px; padding-top:16px; border-top:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;
    font-size:11.5px; color:var(--muted-2);
  }

  .locked-next{
    margin-top:6px; text-align:center; font-size:11.5px; color:var(--muted-2);
    font-family:var(--font-mono);
  }

  @media (max-width:640px){
    .stats-row{grid-template-columns:1fr 1fr;}
    .manifest-header h1{font-size:21px;}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* =========================================================================
   PRICING LEAD TRAINER — motor offline (IndexedDB + repetición espaciada)
   Etapa 0: Cimientos. Arquitectura pensada para extenderse a futuras etapas.
   ========================================================================= */

/* ---------------------- DATOS: Etapa 0 (8 conceptos) ---------------------- */
const LESSONS = [
  {
    id:'L1', code:'C-01', stage:0, title:'Por qué existen los intermediarios en el comercio internacional',
    summary:'Shipper, consignee, carrier y freight forwarder: los cuatro actores base.',
    content:[
      'El comercio internacional ocurre cuando un vendedor en un país (el exportador) envía mercancía a un comprador en otro país (el importador). En la inmensa mayoría de los casos, ni el vendedor ni el comprador poseen barcos, aviones o camiones propios, ni conocen en detalle las normas aduaneras, los procedimientos portuarios o los requisitos documentales del país de destino. Ahí nace la necesidad de un tercero especializado.',
      '<strong>Shipper / Exportador</strong>: la parte que envía la mercancía, generalmente el vendedor. <strong>Consignee / Importador</strong>: la parte que la recibe, generalmente el comprador. <strong>Carrier / Transportista</strong>: la empresa que físicamente mueve la carga — una naviera, una aerolínea o una empresa de transporte terrestre — y que es dueña o arrendataria de los buques, aviones o camiones. <strong>Freight Forwarder / Agente de carga</strong>: un intermediario que organiza el transporte y los servicios asociados en nombre del shipper, sin poseer él mismo los medios de transporte.',
      'La diferencia clave es esta: un forwarder no es un carrier. Funciona como un agente de viajes para la carga — compra espacio y capacidad a distintos carriers, lo combina con servicios de documentación, aduana y seguro, y se lo revende al shipper como un servicio coordinado, muchas veces puerta a puerta.'
    ],
    keyTerms:[
      {t:'Shipper / Exportador', d:'Parte que envía la mercancía; generalmente el vendedor.'},
      {t:'Consignee / Importador', d:'Parte que recibe la mercancía; generalmente el comprador.'},
      {t:'Carrier', d:'Empresa dueña del medio de transporte (naviera, aerolínea, transportista terrestre).'},
      {t:'Freight Forwarder', d:'Intermediario que organiza el transporte sin poseer los medios físicos.'}
    ],
    whyItMatters:'All Trans Cargo Group es un freight forwarder, no un carrier. Esta distinción es la base de todo el modelo de pricing que aprenderás: la empresa no fija tarifas sobre activos propios, sino sobre la capacidad que compra a terceros más el valor de su propio servicio.',
    questions:[
      {id:'L1Q1', prompt:'¿Cuál es la diferencia principal entre un carrier y un freight forwarder?',
       options:['El carrier organiza documentos; el forwarder transporta físicamente la carga.','El carrier posee los medios de transporte; el forwarder organiza el transporte sin poseerlos.','No hay diferencia, son sinónimos.','El forwarder solo trabaja con carga aérea.'],
       correct:1, explanation:'El carrier es dueño (o arrendatario) del buque, avión o camión. El forwarder organiza y coordina el servicio sin poseer esos activos.'},
      {id:'L1Q2', prompt:'El consignee es...',
       options:['Quien envía la mercancía','Quien la recibe','La naviera que la transporta','El gobierno del país exportador'],
       correct:1, explanation:'Consignee = importador = quien recibe la mercancía en destino.'},

      '<strong>Cotización (Quote)</strong>: una tarifa ofrecida en respuesta a una solicitud específica de un cliente, normalmente válida por un tiempo limitado. <strong>SLA (Service Level Agreement)</strong>: un estándar prometido — en este contexto, principalmente el tiempo de respuesta prometido a una solicitud de cotización. <strong>KPI (Key Performance Indicator)</strong>: un número específico y medible que se usa para saber si un equipo o proceso está funcionando bien.'

  {

    summary:'Las reglas que definen quién paga qué, y dónde, entre vendedor y comprador.',
    content:[
      'Un Incoterm es una regla estandarizada, publicada por la Cámara de Comercio Internacional (ICC), que define quién es responsable del costo, el riesgo y las tareas logísticas en cada punto del trayecto entre vendedor y comprador. No fija el precio de la mercancía — fija el <strong>alcance</strong> de lo que cada parte debe cubrir.',
      'Algunos de los más relevantes para pricing: <strong>EXW (Ex Works)</strong> — el comprador asume casi toda la responsabilidad, desde recoger la carga en la fábrica del vendedor. <strong>FOB (Free On Board)</strong> — el vendedor entrega la carga a bordo del buque en el puerto de origen; de ahí en adelante, es responsabilidad del comprador (aplica solo a transporte marítimo). <strong>CIF (Cost, Insurance and Freight)</strong> — el vendedor paga el flete y el seguro hasta el puerto de destino (también solo marítimo). <strong>DAP (Delivered At Place)</strong> — el vendedor entrega en el lugar acordado, sin incluir la descarga. <strong>DDP (Delivered Duty Paid)</strong> — el vendedor asume prácticamente todo, incluyendo los aranceles de importación.',
      'Los Incoterms se dividen en dos grupos: reglas que aplican a cualquier modo de transporte (EXW, FCA, CPT, CIP, DAP, DPU, DDP) y reglas exclusivas para transporte marítimo o por vías navegables interiores (FAS, FOB, CFR, CIF).'

    keyTerms:[

      {t:'CIF', d:'Cost, Insurance and Freight — el vendedor cubre flete y seguro hasta destino (solo marítimo).'},
      {t:'DAP', d:'Delivered At Place — el vendedor entrega en destino, sin incluir la descarga.'},

    whyItMatters:'El Incoterm que aplica a un embarque determina exactamente qué componentes de costo debe incluir el forwarder en su cotización. Cotizar el mismo contenedor físico bajo FOB o bajo DDP produce tarifas muy distintas, porque cada regla incluye tramos y responsabilidades diferentes.',

      model:'FOB deja la responsabilidad del transporte principal, el seguro y los trámites de importación al comprador desde que la carga se carga en el buque de origen; DDP obliga al vendedor —y por tanto a la tarifa cotizada— a cubrir prácticamente todo el trayecto, incluyendo los aranceles de importación. Como cada Incoterm incluye tramos y responsabilidades distintas, el alcance del servicio, y por tanto el costo a cubrir, es diferente, así que el precio también debe serlo.'

  {
    id:'L10', code:'C-10', stage:1, title:'Los componentes de una tarifa de flete',
    summary:'BAF, CAF, THC, ISPS, chassis, demurrage, detention y accesorios: lo que hay detrás del flete base.',
    content:[
      'La tarifa que ve un cliente casi nunca es solo "flete base". <strong>BAF (Bunker Adjustment Factor)</strong>: recargo por fluctuación del precio del combustible marítimo. <strong>CAF (Currency Adjustment Factor)</strong>: recargo por riesgo de fluctuación cambiaria. <strong>THC (Terminal Handling Charge)</strong>: cargo por el manejo del contenedor en la terminal portuaria, tanto en origen como en destino. <strong>ISPS</strong>: un pequeño recargo obligatorio de seguridad portuaria y naviera internacional.',
      '<strong>Chassis</strong>: cargo por el equipo usado para mover el contenedor por tierra. <strong>Demurrage</strong>: se cobra cuando el contenedor permanece en la terminal portuaria más allá del tiempo libre asignado. <strong>Detention</strong>: se cobra cuando el equipo del carrier permanece fuera de la terminal (en manos del cliente) más allá del tiempo libre. Desde 2024, la FMC exige que las facturas de demurrage y detention incluyan información mínima específica para ser válidas y cobrables — un ejemplo real de cómo la regulación, que verás a fondo en la próxima lección, toca directamente los cargos que cotizas.',
      '<strong>Accesorios (accessorials)</strong>: término general para cargos adicionales no incluidos en el flete base — cargos por documentación, inspección, u otros servicios puntuales.'

    keyTerms:[
      {t:'BAF', d:'Recargo por combustible.'},
      {t:'THC', d:'Cargo por manejo en terminal portuaria.'},
      {t:'Demurrage', d:'Cargo por exceso de tiempo del contenedor en la terminal.'},

    ],
    whyItMatters:'La "tarifa" que aparece en el KPI de margen promedio del JD no es solo el flete base — es la suma de todos estos componentes, y cada uno es un lugar donde se puede ganar o perder margen si el equipo de pricing los subestima.',

/* ---------------------- Repetición espaciada (Leitner) ---------------------- */
const BOX_INTERVAL_DAYS = {1:1, 2:2, 3:4, 4:7, 5:14, 6:30};
const MAX_BOX = 6;
const MASTER_BOX_THRESHOLD = 3;

function dayMs(d){ return d*24*60*60*1000; }

function nextReviewFor(box){
  const days = BOX_INTERVAL_DAYS[box] || 1;
  return Date.now() + dayMs(days);
}

function gradeAnswer(prevRecord, wasCorrect){
  const rec = prevRecord ? {...prevRecord} : {box:0, streak:0, seen:0, correct:0};
  rec.seen += 1;
  if(wasCorrect){
    rec.correct += 1;
    rec.streak += 1;
    rec.box = Math.min(MAX_BOX, (rec.box||0) + 1);
  } else {
    rec.streak = 0;
    rec.box = 0;
  }
  rec.lastSeen = Date.now();
  rec.nextReview = rec.box === 0 ? Date.now() : nextReviewFor(rec.box);
  return rec;
}

/* ---------------------- IndexedDB ---------------------- */
const DB_NAME = 'pricingLeadTrainerDB';
const DB_VERSION = 1;
let _dbPromise = null;

function openDB(){
  if(_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains('questionProgress')) db.createObjectStore('questionProgress', {keyPath:'id'});
      if(!db.objectStoreNames.contains('reflections')) db.createObjectStore('reflections', {keyPath:'lessonId'});
    };
    req.onsuccess = (e)=>resolve(e.target.result);
    req.onerror = (e)=>reject(e.target.error);
  });
  return _dbPromise;
}
function dbPut(store, value){
  return openDB().then(db=>new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readwrite');
    tx.objectStore(store).put(value);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  }));
}
function dbGetAll(store){
  return openDB().then(db=>new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = ()=>resolve(req.result || []);
    req.onerror = ()=>reject(req.error);
  }));
}
function dbGet(store, key){
  return openDB().then(db=>new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = ()=>resolve(req.result || null);
    req.onerror = ()=>reject(req.error);
  }));
}
function dbClearAll(){
  return openDB().then(db=>new Promise((resolve,reject)=>{
    const tx = db.transaction(['questionProgress','reflections'],'readwrite');
    tx.objectStore('questionProgress').clear();
    tx.objectStore('reflections').clear();
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  }));
}

/* Cache en memoria de progreso, sincronizado con IndexedDB */
let progressCache = {};

async function loadProgress(){
  const rows = await dbGetAll('questionProgress');
  progressCache = {};
  rows.forEach(r=>{ progressCache[r.id] = r; });
}

async function recordAnswer(questionId, wasCorrect){
  const updated = gradeAnswer(progressCache[questionId], wasCorrect);
  updated.id = questionId;
  progressCache[questionId] = updated;
  await dbPut('questionProgress', updated);
  return updated;
}

/* ---------------------- Helpers de estado por lección ---------------------- */
function allQuestions(){
  const core = LESSONS.flatMap(l => l.questions.map(q => ({...q, lessonId:l.id, lessonCode:l.code})));
  const bonus = LESSONS.flatMap(l => (l.bonusExercises||[]).map(q => ({...q, lessonId:l.id, lessonCode:l.code})));
  return core.concat(bonus);
}

/* El estado de una lección se basa SOLO en sus preguntas originales (mc/tf) —
   los ejercicios bonus (emparejar/ordenar) son práctica adicional con su propia
   repetición espaciada, pero no bloquean ni definen "completado"/"dominado". */
function lessonStats(lesson){
  const qs = lesson.questions;
  let attempted = 0, completedOnce = 0, mastered = 0;
  qs.forEach(q=>{
    const r = progressCache[q.id];
    if(r && r.seen>0) attempted++;
    if(r && r.box>=1) completedOnce++;
    if(r && r.box>=MASTER_BOX_THRESHOLD) mastered++;
  });
  let status = 'new';
  if(mastered === qs.length) status = 'mastered';
  else if(completedOnce === qs.length) status = 'completed';
  else if(attempted > 0) status = 'progress';
  return {attempted, completedOnce, mastered, total:qs.length, status};
}

/* "Incompleto" para efectos de navegación = todavía no se respondió todo bien
   al menos una vez. 'completed' y 'mastered' cuentan como suficiente para avanzar;
   la profundización hacia 'mastered' ocurre después, vía repaso espaciado. */
function isIncomplete(lesson){
  const s = lessonStats(lesson).status;
  return s === 'new' || s === 'progress';
}

function lessonsInStage(stageId){
  return LESSONS.filter(l => l.stage === stageId);
}

function dueCountFor(lessons){
  const ids = new Set(lessons.flatMap(l => l.questions.map(q=>q.id).concat((l.bonusExercises||[]).map(q=>q.id))));
  return allQuestions().filter(q=>{
    if(!ids.has(q.id)) return false;
    const r = progressCache[q.id];
    return r && r.seen>0 && r.nextReview <= Date.now();
  }).length;
}

function stageStats(stageId){
  const lessons = lessonsInStage(stageId);
  const total = lessons.length;
  let masteredLessons = 0, completedLessons = 0;
  let totalQ = 0, masteredQ = 0;
  lessons.forEach(l=>{
    const s = lessonStats(l);
    if(s.status==='mastered') masteredLessons++;
    if(s.status==='mastered' || s.status==='completed') completedLessons++;
    totalQ += s.total; masteredQ += s.mastered;
  });
  return {total, masteredLessons, completedLessons, totalQ, masteredQ, dueCount: dueCountFor(lessons)};
}

function grandStats(){
  const total = LESSONS.length;
  let masteredLessons = 0;
  LESSONS.forEach(l=>{ if(lessonStats(l).status==='mastered') masteredLessons++; });
  const dueCount = dueCountFor(LESSONS);
  return {total, masteredLessons, dueCount, stageCount: STAGE_META.length};
}

function nextIncompleteInStage(stageId){
  for(const l of lessonsInStage(stageId)){
    if(isIncomplete(l)) return l;
  }
  return null;
}

function nextIncompleteGlobal(){
  for(const l of LESSONS){
    if(isIncomplete(l)) return l;
  }
  return null;
}

/* ---------------------- Ejercicios generados: emparejar y ordenar ----------------------
   Se derivan de datos que cada lección ya tiene (keyTerms, sequence/steps), así que no
   requieren autoría nueva de contenido — solo una forma distinta de practicarlo. */
function buildMatchExercise(lesson){
  if(!lesson.keyTerms || lesson.keyTerms.length < 3) return null;
  const pairs = lesson.keyTerms.slice(0, 5).map((k,i)=>({key:'p'+i, term:k.t, def:k.d}));
  return {
    id: lesson.id+'MATCH',
    kind:'match',
    prompt:'Empareja cada término con su definición correcta.',
    pairs,
    explanation:'Repasa los términos clave de la lección si alguno no coincidió.'
  };
}

function buildOrderExercise(lesson){
  const seq = lesson.sequence || (lesson.steps ? lesson.steps.map(s=>s.t) : null);
  if(!seq || seq.length < 3) return null;
  return {
    id: lesson.id+'ORDER',
    kind:'order',
    prompt:'Ordena los siguientes pasos en la secuencia correcta.',
    items: seq,
    explanation:'Repasa el contenido de la lección para confirmar el orden correcto.'
  };
}

/* Enriquecer cada lección con sus ejercicios bonus derivados (una sola vez, al cargar). */
LESSONS.forEach(l=>{
  const bonus = [];
  const m = buildMatchExercise(l); if(m) bonus.push(m);
  const o = buildOrderExercise(l); if(o) bonus.push(o);
  l.bonusExercises = bonus;
});

/* ---------------------- Router ---------------------- */
function route(){
  const hash = location.hash.replace(/^#\/?/, '');
  const parts = hash.split('/').filter(Boolean);
  if(parts.length===0 || parts[0]==='dashboard'){
    const stageArg = parts[1]!==undefined ? parseInt(parts[1],10) : NaN;
    renderDashboard(Number.isNaN(stageArg) ? null : stageArg);
  }
  else if(parts[0]==='lesson' && parts[1]) renderLesson(parts[1]);
  else if(parts[0]==='quiz' && parts[1]) renderQuiz(parts[1]);
  else if(parts[0]==='review') renderReview();
  else renderDashboard(null);
  restartViewFade();
}
window.addEventListener('hashchange', route);

/* Reinicia la animación de entrada del panel en cada navegación mayor
   (tablero, lección, inicio de cuestionario, repaso). Las transiciones
   entre preguntas dentro de un mismo cuestionario se mantienen instantáneas
   a propósito, para no introducir demora entre responder y leer la siguiente. */
function restartViewFade(){
  const el = document.getElementById('app');
  if(!el) return;
  el.classList.remove('fade');
  void el.offsetWidth;
  el.classList.add('fade');
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------------------- Vista: Dashboard ---------------------- */
function renderDashboard(explicitStageId){
  const app = document.getElementById('app');

  let stageId = explicitStageId;
  if(stageId===null || stageId===undefined || !STAGE_META.some(s=>s.id===stageId)){
    const nxt = nextIncompleteGlobal();
    stageId = nxt ? nxt.stage : STAGE_META[STAGE_META.length-1].id;
  }

  const meta = STAGE_META.find(s=>s.id===stageId);
  const stageLessons = lessonsInStage(stageId);
  const stats = stageStats(stageId);
  const gStats = grandStats();
  const next = nextIncompleteInStage(stageId);

  const tabsHtml = STAGE_META.map(sm=>{
    const st = stageStats(sm.id);
    const isActive = sm.id===stageId ? 'active' : '';
    const isDone = st.masteredLessons===st.total ? 'stage-done' : '';
    return `<button class="stage-tab ${isActive} ${isDone}" onclick="location.hash='#/dashboard/${sm.id}'">
      <span class="t">Etapa ${sm.id} — ${esc(sm.title)}</span>
      <span class="p">${st.completedLessons}/${st.total} completados</span>
    </button>`;
  }).join('');

  const routeNav = stageLessons.map(l=>{
    const s = lessonStats(l);
    const cls = s.status;
    const isCurrent = next && next.id===l.id ? 'current' : '';
    const dotContent = s.status==='mastered' ? '&#10003;' : (s.status==='completed' ? '&#9679;' : l.code.split('-')[1]);
    return `<button class="route-node ${cls} ${isCurrent}" onclick="location.hash='#/lesson/${l.id}'" title="${esc(l.title)}">
      <span class="dot">${dotContent}</span>
      <span class="label">${esc(l.code)}</span>
    </button>`;
  }).join('');

  const cards = stageLessons.map(l=>{
    const s = lessonStats(l);
    const badge = s.status==='mastered' ? '<span class="badge mastered">Dominado</span>'
      : s.status==='completed' ? '<span class="badge completed">Completado</span>'
      : s.status==='progress' ? '<span class="badge progress">En progreso</span>'
      : '<span class="badge new">Sin empezar</span>';
    return `<a class="concept-card" href="#/lesson/${l.id}" style="text-decoration:none;">
      <span class="code">${esc(l.code)}</span>
      <span class="body">
        <h3>${esc(l.title)}</h3>
        <p>${esc(l.summary)}</p>
      </span>
      ${badge}
    </a>`;
  }).join('');

  const nextStageMeta = STAGE_META.find(s=>s.id===stageId+1);
  const fullyMastered = stats.masteredLessons===stats.total;
  let continueBlock;
  if(next){
    continueBlock = `<div class="continue-bar">
        <div class="txt"><strong>Continuar donde quedaste</strong><span>${esc(next.code)} · ${esc(next.title)}</span></div>
        <a class="btn" href="#/lesson/${next.id}">Continuar →</a>
      </div>`;
  } else if(nextStageMeta){
    continueBlock = `<div class="continue-bar">
        <div class="txt"><strong>Etapa ${stageId} completada</strong><span>Completaste los ${stats.total} conceptos de esta etapa${fullyMastered ? ', todos ya dominados' : ''}. Sigue con la Etapa ${nextStageMeta.id} — ${esc(nextStageMeta.title)}.</span></div>
        <a class="btn brass" href="#/dashboard/${nextStageMeta.id}">Ir a Etapa ${nextStageMeta.id} →</a>
      </div>`;
  } else {
    continueBlock = `<div class="continue-bar">
        <div class="txt"><strong>Etapa ${stageId} completada</strong><span>${fullyMastered ? `Dominaste los ${stats.total} conceptos de esta etapa. Sigue repasando para no perderlos.` : `Completaste los ${stats.total} conceptos de esta etapa. El repaso espaciado los irá llevando a dominio total.`}</span></div>
        <a class="btn brass" href="#/review">Repasar</a>
      </div>`;
  }

  app.innerHTML = `
    <header class="manifest-header">
      <div>
        <div class="brandmark">Pricing Lead Trainer</div>
        <h1>Etapa ${stageId} — ${esc(meta.title)}</h1>
        <div class="subtitle">${esc(meta.subtitle)}</div>
      </div>
      <span class="stage-tag">ETAPA ${stageId} / 08</span>
    </header>

    <div class="overall-line">PROGRESO TOTAL: ${gStats.masteredLessons}/${gStats.total} conceptos dominados en ${gStats.stageCount} etapas · ${gStats.dueCount} repasos pendientes en total</div>

    <div class="stage-tabs">${tabsHtml}</div>

    <nav class="route-line" aria-label="Progreso de la ruta de conceptos">${routeNav}</nav>

    <div class="stats-row">
      <div class="stat-card"><div class="num">${stats.masteredLessons}/${stats.total}</div><div class="lbl">Conceptos dominados</div></div>
      <div class="stat-card"><div class="num">${stats.masteredQ}/${stats.totalQ}</div><div class="lbl">Preguntas dominadas</div></div>
      <div class="stat-card"><div class="num">${stats.dueCount}</div><div class="lbl">Repasos pendientes (esta etapa)</div></div>
    </div>

    ${continueBlock}

    <div class="concept-list">${cards}</div>

    ${gStats.dueCount>0 ? `<div style="margin-top:22px; text-align:center;"><a class="btn ghost" href="#/review">Ir a repaso mixto (${gStats.dueCount} pendientes en total)</a></div>` : ''}

    <footer class="appfoot">
      <span>Datos guardados localmente en este navegador (IndexedDB) — sin conexión, sin servidores.</span>
      <button class="btn ghost small" onclick="resetProgress()">Reiniciar progreso</button>
    </footer>
  `;
}

/* ---------------------- Vista: Lección ---------------------- */
function renderLesson(lessonId){
  const app = document.getElementById('app');
  const lesson = LESSONS.find(l=>l.id===lessonId);
  if(!lesson){ renderDashboard(); return; }

  const paragraphs = (lesson.content||[]).map(p=>`<p>${p}</p>`).join('');

  const stepsHtml = lesson.steps ? `
    <div class="term-grid">
      ${lesson.steps.map(s=>`<div class="term-row"><div class="t">Paso ${s.n} — ${esc(s.t)}</div><div class="d">${esc(s.d)}</div></div>`).join('')}
    </div>` : '';

  const termsHtml = (lesson.keyTerms && lesson.keyTerms.length) ? `
    <div class="callout">
      <span class="tag">Términos clave</span>
      <div class="term-grid">
        ${lesson.keyTerms.map(k=>`<div class="term-row"><div class="t">${esc(k.t)}</div><div class="d">${esc(k.d)}</div></div>`).join('')}
      </div>
    </div>` : '';

  app.innerHTML = `
    <div class="crumb"><a href="#/dashboard/${lesson.stage}">← Panel</a></div>
    <div class="lesson-head">
      <div class="code">${esc(lesson.code)}</div>
      <h2>${esc(lesson.title)}</h2>
    </div>
    <div class="lesson-content">
      ${paragraphs}
      ${stepsHtml}
      ${termsHtml}
      <div class="callout">
        <span class="tag">Por qué importa para pricing</span>
        <p>${esc(lesson.whyItMatters)}</p>
      </div>
    </div>
    <div class="lesson-actions">
      <a class="btn" href="#/quiz/${lesson.id}">Ir al cuestionario →</a>
      <a class="btn ghost" href="#/dashboard/${lesson.stage}">Volver al panel</a>
    </div>
  `;
}

/* ---------------------- Vista: Quiz (por lección o repaso) ---------------------- */
let quizSession = null;

function shuffle(arr){ return [...arr].sort(()=>Math.random()-0.5); }

function detectKind(q){
  if(q.kind) return q.kind;
  if(q.options && q.options.length===2 && q.options[0]==='Verdadero' && q.options[1]==='Falso') return 'tf';
  return 'mc';
}

function renderQuiz(lessonId){
  const lesson = LESSONS.find(l=>l.id===lessonId);
  if(!lesson){ renderDashboard(); return; }
  const core = lesson.questions.map(q=>({...q, lessonId:lesson.id, kind:detectKind(q)}));
  const bonus = (lesson.bonusExercises||[]).map(q=>({...q, lessonId:lesson.id}));
  quizSession = {
    mode:'lesson',
    lesson,
    questions: core.concat(bonus),
    index:0,
    correctCount:0,
    answered:false
  };
  renderQuizQuestion();
}

function renderReview(){
  const due = allQuestions().filter(q=>{
    const r = progressCache[q.id];
    return r && r.seen>0 && r.nextReview <= Date.now();
  }).map(q=>({...q, kind:detectKind(q)}));
  if(due.length===0){
    document.getElementById('app').innerHTML = `
      <div class="crumb"><a href="#/dashboard">← Panel</a></div>
      <div class="empty-state">
        <p>No tienes repasos pendientes en este momento. Vuelve más tarde, o avanza con un concepto nuevo.</p>
        <a class="btn" href="#/dashboard" style="margin-top:14px;">Volver al panel</a>
      </div>`;
    return;
  }
  const shuffled = shuffle(due);
  quizSession = {
    mode:'review',
    lesson:null,
    questions: shuffled,
    index:0,
    correctCount:0,
    answered:false
  };
  renderQuizQuestion();
}

function renderQuizQuestion(){
  const app = document.getElementById('app');
  const qs = quizSession;
  if(qs.index >= qs.questions.length){
    renderQuizSummary();
    return;
  }
  const q = qs.questions[qs.index];
  const pct = Math.round((qs.index / qs.questions.length) * 100);
  const title = qs.mode==='lesson' ? `${qs.lesson.code} · Cuestionario` : 'Repaso mixto';
  const backHref = qs.mode==='lesson' ? `#/dashboard/${qs.lesson.stage}` : '#/dashboard';

  let bodyHtml;
  if(q.kind==='match'){
    qs.matchLocked = {}; qs.matchMistakes = 0; qs.matchSelected = null;
    qs.matchTermsDisplay = shuffle(q.pairs.map(p=>({key:p.key, label:p.term})));
    qs.matchDefsDisplay = shuffle(q.pairs.map(p=>({key:p.key, label:p.def})));
    bodyHtml = `<p class="prompt">${esc(q.prompt)}</p><div id="exerciseBody">${renderMatchHTML(q)}</div>`;
  } else if(q.kind==='order'){
    qs.orderPool = shuffle(q.items.map((label,idx)=>({idx, label})));
    qs.orderPlaced = [];
    bodyHtml = `<p class="prompt">${esc(q.prompt)}</p><div id="exerciseBody">${renderOrderHTML(q)}</div>`;
  } else {
    const optsClass = q.kind==='tf' ? ' opts-tf' : '';
    bodyHtml = `<p class="prompt">${esc(q.prompt)}</p>
      <div id="opts" class="${optsClass}">
        ${q.options.map((opt,i)=>`<button class="opt" data-i="${i}" onclick="answerQuiz(${i})">${esc(opt)}</button>`).join('')}
      </div>`;
  }

  app.innerHTML = `
    <div class="crumb"><a href="${backHref}">← Panel</a></div>
    <div class="quiz-progress">
      ${esc(title)} — ${q.kind==='match'?'Emparejar':q.kind==='order'?'Ordenar':'Pregunta'} ${qs.index+1} de ${qs.questions.length}
      <div class="barbg"><div class="barfg" style="width:${pct}%"></div></div>
    </div>
    <div class="q-card">
      ${bodyHtml}
      <div id="feedback"></div>
      <div id="nextBtnWrap"></div>
    </div>
  `;
}

/* Vía única de cierre de ejercicio, compartida por los cuatro tipos (mc/tf/match/order) */
async function finishExercise(id, wasCorrect, feedbackHtml){
  const qs = quizSession;
  qs.answered = true;
  await recordAnswer(id, wasCorrect);
  if(wasCorrect) qs.correctCount++;
  document.getElementById('feedback').innerHTML = feedbackHtml;
  document.getElementById('nextBtnWrap').innerHTML =
    `<div style="margin-top:16px;"><button class="btn brass" onclick="advanceQuiz()">
      ${qs.index+1 < qs.questions.length ? 'Siguiente →' : 'Ver resultado →'}
    </button></div>`;
}

async function answerQuiz(i){
  const qs = quizSession;
  if(qs.answered) return;
  const q = qs.questions[qs.index];
  const wasCorrect = (i === q.correct);

  const optBtns = document.querySelectorAll('#opts .opt');
  optBtns.forEach((btn,idx)=>{
    btn.setAttribute('disabled','true');
    if(idx===q.correct) btn.classList.add('correct');
    if(idx===i && !wasCorrect) btn.classList.add('incorrect');
  });

  const fbHtml = `<div class="feedback ${wasCorrect?'ok':'bad'}">
      <span class="lbl">${wasCorrect ? 'Correcto.' : 'No es correcto.'}</span>
      ${esc(q.explanation)}
    </div>`;
  await finishExercise(q.id, wasCorrect, fbHtml);
}

/* ---------- Ejercicio: emparejar (clic en término, luego en definición) ---------- */
function renderMatchHTML(q){
  const qs = quizSession;
  const termsHtml = qs.matchTermsDisplay.map(t=>{
    const locked = qs.matchLocked[t.key];
    const isSelected = qs.matchSelected===t.key;
    let cls = 'match-chip';
    if(locked) cls += locked.correct ? ' correct' : ' incorrect';
    else if(isSelected) cls += ' selected';
    return `<button class="${cls}" ${locked?'disabled':''} onclick="selectMatchTerm('${t.key}')">${esc(t.label)}</button>`;
  }).join('');
  const defsHtml = qs.matchDefsDisplay.map(d=>{
    let cls = 'match-chip';
    let disabled = false;
    for(const k in qs.matchLocked){
      if(qs.matchLocked[k].defKey === d.key){
        disabled = true;
        cls += qs.matchLocked[k].correct ? ' correct' : ' incorrect';
        break;
      }
    }
    return `<button class="${cls}" ${disabled?'disabled':''} onclick="selectMatchDef('${d.key}')">${esc(d.label)}</button>`;
  }).join('');
  return `<div class="match-grid">
    <div class="match-col">${termsHtml}</div>
    <div class="match-col">${defsHtml}</div>
  </div>`;
}

function selectMatchTerm(key){
  const qs = quizSession;
  if(qs.answered || qs.matchLocked[key]) return;
  qs.matchSelected = key;
  document.getElementById('exerciseBody').innerHTML = renderMatchHTML(qs.questions[qs.index]);
}

async function selectMatchDef(defKey){
  const qs = quizSession;
  if(qs.answered || !qs.matchSelected) return;
  for(const k in qs.matchLocked){ if(qs.matchLocked[k].defKey===defKey) return; }
  const q = qs.questions[qs.index];
  const correct = qs.matchSelected === defKey;
  qs.matchLocked[qs.matchSelected] = {defKey, correct};
  if(!correct) qs.matchMistakes++;
  qs.matchSelected = null;
  document.getElementById('exerciseBody').innerHTML = renderMatchHTML(q);

  if(Object.keys(qs.matchLocked).length === q.pairs.length){
    const totalPairs = q.pairs.length;
    const wasCorrect = qs.matchMistakes === 0;
    const fbHtml = `<div class="feedback ${wasCorrect?'ok':'bad'}">
        <span class="lbl">${wasCorrect ? '¡Todas correctas!' : `Emparejaste ${totalPairs-qs.matchMistakes} de ${totalPairs} correctamente.`}</span>
        ${esc(q.explanation)}
      </div>`;
    await finishExercise(q.id, wasCorrect, fbHtml);
  }
}

/* ---------- Ejercicio: ordenar (clic en cada paso, en el orden correcto) ---------- */
function renderOrderHTML(q){
  const qs = quizSession;
  const poolHtml = qs.orderPool.map(item=>
    `<button class="order-chip" onclick="pickOrderItem(${item.idx})">${esc(item.label)}</button>`
  ).join('') || '<span class="order-empty">— sin elementos restantes —</span>';
  const placedHtml = qs.orderPlaced.map((idx,pos)=>
    `<div class="order-slot"><span class="order-num">${pos+1}</span>${esc(q.items[idx])}</div>`
  ).join('') || '<span class="order-empty">Haz clic en los elementos, en el orden que creas correcto.</span>';
  const showUndo = qs.orderPlaced.length>0 && qs.orderPlaced.length<q.items.length;
  return `
    <div class="order-pool">${poolHtml}</div>
    <div class="order-seq">${placedHtml}</div>
    ${showUndo ? `<button class="btn ghost small" onclick="undoOrderItem()" style="margin-top:10px;">Deshacer último</button>` : ''}
  `;
}

function pickOrderItem(idx){
  const qs = quizSession;
  if(qs.answered || qs.orderPlaced.includes(idx)) return;
  qs.orderPlaced.push(idx);
  qs.orderPool = qs.orderPool.filter(item=>item.idx!==idx);
  renderOrderBody();
}

function undoOrderItem(){
  const qs = quizSession;
  if(qs.answered) return;
  const q = qs.questions[qs.index];
  const last = qs.orderPlaced.pop();
  if(last!==undefined) qs.orderPool.push({idx:last, label:q.items[last]});
  renderOrderBody();
}

function renderOrderBody(){
  const qs = quizSession;
  const q = qs.questions[qs.index];
  document.getElementById('exerciseBody').innerHTML = renderOrderHTML(q);
  if(qs.orderPlaced.length === q.items.length) evaluateOrder();
}

async function evaluateOrder(){
  const qs = quizSession;
  if(qs.answered) return;
  const q = qs.questions[qs.index];
  const wasCorrect = q.items.every((label,i)=> qs.orderPlaced[i]===i);
  let detail = '';
  if(!wasCorrect){
    detail = '<div class="order-correct-ref"><strong>Orden correcto:</strong><br>' +
      q.items.map((label,i)=>`${i+1}. ${esc(label)}`).join('<br>') + '</div>';
  }
  const fbHtml = `<div class="feedback ${wasCorrect?'ok':'bad'}">
      <span class="lbl">${wasCorrect ? '¡Orden correcto!' : 'El orden no es correcto.'}</span>
      ${esc(q.explanation)}
      ${detail}
    </div>`;
  await finishExercise(q.id, wasCorrect, fbHtml);
}

function advanceQuiz(){
  quizSession.index++;
  quizSession.answered = false;
  renderQuizQuestion();
}

function renderQuizSummary(){
  const app = document.getElementById('app');
  const qs = quizSession;
  const total = qs.questions.length;
  const pct = Math.round((qs.correctCount/total)*100);

  let reflectionHtml = '';
  if(qs.mode==='lesson' && qs.lesson.reflection){
    reflectionHtml = `
      <div class="reflection" id="reflectionBox">
        <span class="tag">Autoevaluación abierta</span>
        <h4>${esc(qs.lesson.reflection.prompt)}</h4>
        <textarea id="reflectionText" placeholder="Escribe tu respuesta aquí (queda guardada solo en este navegador)..."></textarea>
        <div class="row">
          <button class="btn ghost small" onclick="saveReflection('${qs.lesson.id}')">Guardar</button>
          <button class="btn ghost small" onclick="toggleModelAnswer()">Mostrar respuesta modelo</button>
          <span class="saved-note" id="savedNote">Guardado ✓</span>
        </div>
        <div class="model-answer" id="modelAnswer">${esc(qs.lesson.reflection.model)}</div>
      </div>
    `;
  }

  const summaryBackHref = qs.mode==='lesson' ? `#/dashboard/${qs.lesson.stage}` : '#/dashboard';
  app.innerHTML = `
    <div class="crumb"><a href="${summaryBackHref}">← Panel</a></div>
    <div class="summary-card">
      <div class="score">${qs.correctCount}/${total}</div>
      <div class="score-lbl">Respuestas correctas (${pct}%)</div>
      <div class="lesson-actions" style="justify-content:center;">
        <a class="btn" href="${summaryBackHref}">Volver al panel</a>
        ${qs.mode==='lesson' ? `<a class="btn ghost" href="#/lesson/${qs.lesson.id}">Repasar la lección</a>` : ''}
      </div>
    </div>
    ${reflectionHtml}
  `;

  if(qs.mode==='lesson'){
    dbGet('reflections', qs.lesson.id).then(saved=>{
      if(saved && saved.text){
        const ta = document.getElementById('reflectionText');
        if(ta) ta.value = saved.text;
      }
    });
  }
}

function toggleModelAnswer(){
  document.getElementById('modelAnswer').classList.toggle('show');
}

async function saveReflection(lessonId){
  const text = document.getElementById('reflectionText').value;
  await dbPut('reflections', {lessonId, text, savedAt:Date.now()});
  const note = document.getElementById('savedNote');
  note.classList.add('show');
  setTimeout(()=>note.classList.remove('show'), 1800);
}

/* ---------------------- Reset ---------------------- */
async function resetProgress(){
  if(!confirm('¿Reiniciar todo el progreso guardado de la Etapa 0? Esta acción no se puede deshacer.')) return;
  await dbClearAll();
  progressCache = {};
  renderDashboard();
}

/* ---------------------- Init ---------------------- */
window.addEventListener('DOMContentLoaded', async ()=>{
  await loadProgress();
  route();
});
</script>
